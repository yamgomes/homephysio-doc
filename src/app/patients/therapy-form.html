<p-panel id="terapia" header="Terapia">
  @if (store.selected(); as patient) {
    <p class="mb-4">{{ patient.therapy ? 'Terapia atual: ' + patient.therapy.title : 'Nenhuma terapia salva.' }}</p>
    <p-fluid>
      <form class="grid gap-4" (ngSubmit)="save()">
        <div class="grid min-w-0 gap-1.5">
          <label class="font-semibold" for="therapy-game">Jogo</label>
          <p-select inputId="therapy-game" name="game" [options]="games" optionLabel="label" optionValue="value"
            [ngModel]="form.gameId" (ngModelChange)="gameChanged($event)" [disabled]="store.busy()" />
          <small class="text-[color:var(--p-text-muted-color,#64748b)]">Postura: {{ definition.postureLabel }}.</small>
          @if (definition.help) { <small>{{ definition.help }}</small> }
        </div>
        <div class="grid min-w-0 gap-1.5">
          <label class="font-semibold" for="therapy-title">Título</label>
          <input pInputText id="therapy-title" name="title" maxlength="120" [(ngModel)]="form.title" required [disabled]="store.busy()">
        </div>
        <div class="grid min-w-0 gap-1.5">
          <label class="font-semibold" for="therapy-metrics">Métricas do relatório</label>
          <p-multiselect inputId="therapy-metrics" name="metrics" [options]="metrics" optionLabel="label"
            optionValue="value" display="chip" [filter]="false" placeholder="Selecione as métricas"
            [(ngModel)]="form.metrics" [disabled]="store.busy()" />
        </div>
        <div class="grid grid-cols-[repeat(auto-fit,minmax(min(100%,180px),1fr))] items-start gap-4">
          @for (field of definition.fields; track field.key) {
            <app-therapy-parameter [class.col-span-full]="field.kind === 'select' || field.kind === 'list'"
              [field]="field" [value]="form[field.key]" [disabled]="store.busy()"
              (changed)="parameterChanged(field, $event)" />
          }
        </div>
        <div><p-button type="submit" label="Salvar terapia" icon="pi pi-save" [loading]="store.busy()" /></div>
      </form>
    </p-fluid>
  }
</p-panel>
